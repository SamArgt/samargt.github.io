name: Deployment check

on:
  workflow_run:
    workflows: ['pages-build-deployment']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  smoke-check:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check published homepage and assets
        env:
          SITE_URL: https://samargt.github.io
        run: |
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors --max-time 30 "$SITE_URL/" -o /tmp/homepage.html
          grep -q '<title>Samuel A.</title>' /tmp/homepage.html
          for asset in styles.css assets/favicon.svg assets/homelab-preview.jpg assets/auto-bean-ui.png assets/audio-source-preview.jpg; do
            curl --fail --silent --show-error --location --retry 3 --retry-all-errors --max-time 30 "$SITE_URL/$asset" -o /dev/null
          done
